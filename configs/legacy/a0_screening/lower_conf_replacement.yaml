project_root: .

source:
  discovered_candidates: data/processed/discovery/discovered_candidates.parquet
  current_pool: data/manifests/screening_pool.tsv
  current_preflight: data/manifests/screening_pool_preflight.tsv

selection:
  target_count: 20
  length_min: 100
  length_max: 500
  min_pdb_to_uniprot_length_ratio: 0.90
  max_pdb_to_uniprot_length_ratio: 1.10
  min_full_length_mapping_coverage: 0.90
  min_entity_mapping_coverage: 0.90
  min_sequence_identity: 0.95
  min_observed_ca_fraction: 0.90
  unique_uniprot: true
  unique_sequence_cluster: true
  max_per_organism: 4
  seed: 20260730

confidence_ranking:
  enabled: true
  direction: ascending
  hard_max: null
  historical_nonbinding_reference_max: 85.0

preflight:
  warn_full_length_mapping_coverage: 0.70
  max_internal_unmapped_fraction: 0.05

runtime:
  request_pause_seconds: 0.05
  continue_on_error: true

output:
  replacement_pool: data/manifests/lower_conf_replacement_pool.tsv
  audit: reports/lower_conf_replacement_audit.json
  checkpoint: data/processed/replacements/lower_conf_replacement_preflight.checkpoint.parquet
  canonical_length_cache: data/processed/replacements/afdb_canonical_length_cache.parquet
