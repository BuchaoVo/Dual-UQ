$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "dual-uq://dataset/schemas/relocation_manifest.v1"
title: Dataset resource relocation manifest
type: object
additionalProperties: false
required:
  - schema_version
  - records
properties:
  schema_version:
    const: dataset.relocation.v1
  records:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - logical_resource_id
        - legacy_path
        - canonical_path
        - content_sha256
        - mode
        - scientific_content_changed
      properties:
        logical_resource_id:
          type: string
          minLength: 1
        legacy_path:
          $ref: "#/$defs/portable_relative_path"
        canonical_path:
          $ref: "#/$defs/portable_relative_path"
        content_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        mode:
          const: byte_identical_copy_with_legacy_read_compatibility
        scientific_content_changed:
          const: false
$defs:
  portable_relative_path:
    type: string
    minLength: 1
    pattern: "^(?!/)(?![A-Za-z]:)(?!.*(?:^|/)\\.\\.?(/|$))(?!.*\\\\).+$"
