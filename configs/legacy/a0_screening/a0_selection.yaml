selection:
  target_total: 12
  target_per_primary_category:
    easy_control: 3
    low_confidence_local: 3
    high_pae_long_range: 3
    high_confidence_state_disagreement: 3

classification:
  # Controls and quality stressors never consume main-mechanism quotas.
  # High-PAE precedes low-confidence because both labels are retained and
  # measured long-range coupling is the defining mechanism of an overlap.
  primary_category_priority:
    - unsupported_afdb_fragment
    - construct_difference_control
    - missing_coordinate_stress
    - high_confidence_state_disagreement
    - high_pae_long_range
    - low_confidence_local
    - easy_control
    - ordinary_or_unclassified
    - insufficient_evidence

thresholds:
  easy_control:
    mapped_plddt_median_min: 90.0
    ca_disagreement_p90_max: 1.0
    high_conf_segment_max_length: 2
    # Read-only Task 6 compatibility aliases; values must match above.
    median_plddt_min: 90.0
    p90_disagreement_max: 1.0

  low_confidence_local:
    internal_below_80_min_length: 5

  high_pae_long_range:
    minimum_sequence_separation: 48
    q90_threshold: 10.0
    above_10_fraction_threshold: 0.20
    # Pilot distributions separate Index 36 (>=0.145) from all controls
    # and other complete candidates (<=0.004).
    above_15_fraction_threshold: 0.10
    rule: any
    # Read-only Task 6 compatibility aliases; values must match above.
    pae_q90_min: 10.0
    pae_above_10_fraction_min: 0.20

  high_confidence_state_disagreement:
    minimum_segment_length: 5
    minimum_segment_median_plddt: 90.0
    minimum_segment_disagreement: 1.0

  # Read-only Task 6 compatibility block. Task 9 uses the canonical block.
  high_conf_state_disagreement:
    min_contiguous_length: 5
    plddt_min: 90.0
    disagreement_threshold: 1.0

quality:
  minimum_full_length_mapping_coverage: 0.90
  minimum_entity_mapping_coverage: 0.90
  minimum_sequence_identity: 0.95
  minimum_observed_ca_fraction: 0.90
